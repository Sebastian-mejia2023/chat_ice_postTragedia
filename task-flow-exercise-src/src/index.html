<body>
  <main class="container">
    <header class="app-header">
      <h1>TaskFlow</h1>
      <p class="subtitle">Taller Práctico: Estado, Filtros y Librerías Externas</p>
    </header>

    <form id="task-form">
      <input id="txt" type="text" placeholder="¿Qué necesitas hacer hoy?" autocomplete="off" required />
      <button type="submit" id="add-btn">Agregar</button>
    </form>

    <!-- ===================================================================
         TODO (Fase 3): Barra de herramientas y filtros.
         Agrega aquí una sección con:
         1. Grupo de botones para los filtros: "Todas", "Activas", "Completadas".
            (Pista: Puedes usar atributos data-filter y la clase "active").
         2. Un elemento contador para indicar cuántas tareas pendientes quedan.
         =================================================================== -->
    <section class="toolbar" id="toolbar" style="display: none;">
      <!-- Inserta aquí tus botones de filtro y el contador -->
    </section>

    <ul id="task-list" class="task-list"></ul>
  </main>

  <script type="module" src="js/app.js"></script>
